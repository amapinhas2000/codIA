<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Página de Login - Acesse sua conta com segurança.">
  <title>Entrar | Portal Tecninfo</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔑</text></svg>">

  <!-- Google Fonts - Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS Customizado -->
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <!-- Elemento de Fundo Decorativo (Dunas de Areia Abstratas) -->
  <div class="decor-background">
    <div class="sand-dune dune-1"></div>
    <div class="sand-dune dune-2"></div>
    <div class="sand-dune dune-3"></div>
  </div>

  <main class="login-wrapper">
    <div class="login-card">
      <!-- Cabeçalho do Card -->
      <div class="login-header">
        <div class="logo-container" aria-hidden="true">
          <!-- Logo Minimalista Relacionada ao Tema Sand/Dune/Tech -->
          <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 15L85 75H15L50 15Z" fill="url(#logo-gradient)" />
            <path d="M50 35L73 75H27L50 35Z" fill="#ffffff" opacity="0.3" />
            <circle cx="50" cy="55" r="10" fill="#ffffff" />
            <defs>
              <linearGradient id="logo-gradient" x1="15" y1="15" x2="85" y2="75" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#bf9a78" />
                <stop offset="100%" stop-color="#8c6a4a" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1 class="login-title">Bem-vindo de volta</h1>
        <p class="login-subtitle">Insira suas credenciais para acessar sua conta institucional.</p>
      </div>

      <!-- Formulário de Login -->
      <form class="login-form" id="login-form" novalidate>
        
        <!-- Input de Email -->
        <div class="input-group">
          <div class="input-relative">
            <input type="email" id="email" class="form-input" placeholder=" " required autocomplete="email">
            <label for="email" class="form-label">E-mail corporativo</label>
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>
          </div>
          <span class="error-message" id="email-error">Por favor, insira um e-mail válido.</span>
        </div>

        <!-- Input de Senha -->
        <div class="input-group">
          <div class="input-relative">
            <input type="password" id="password" class="form-input" placeholder=" " required autocomplete="current-password">
            <label for="password" class="form-label">Sua senha</label>
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <button type="button" class="btn-toggle-password" id="toggle-password" aria-label="Mostrar senha">
              <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <span class="error-message" id="password-error">A senha deve ter pelo menos 6 caracteres.</span>
        </div>

        <!-- Ações Auxiliares (Lembrar-me & Esqueci a Senha) -->
        <div class="form-actions">
          <label class="checkbox-container">
            <input type="checkbox" id="remember">
            <span class="custom-checkbox"></span>
            <span class="checkbox-label">Lembrar-me</span>
          </label>
          <a href="#" class="forgot-password-link">Esqueceu a senha?</a>
        </div>

        <!-- Botão de Envio -->
        <button type="submit" class="btn-submit" id="btn-submit">
          <span class="btn-text">Entrar na plataforma</span>
          <span class="btn-loader" aria-hidden="true"></span>
        </button>
      </form>

      <!-- Divisor Social -->
      <div class="divider">
        <span>ou continue com</span>
      </div>

      <!-- Logins Sociais -->
      <div class="social-login-grid">
        <button type="button" class="btn-social" aria-label="Entrar com o Google">
          <svg viewBox="0 0 24 24" class="social-icon" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
          </svg>
          Google
        </button>
        <button type="button" class="btn-social" aria-label="Entrar com a Apple">
          <svg viewBox="0 0 24 24" class="social-icon" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.17c.66-.81 1.11-1.93.99-3.06-1 .04-2.21.67-2.93 1.49-.62.69-1.16 1.84-1.01 2.96 1.12.09 2.27-.57 2.95-1.39z"/>
          </svg>
          Apple
        </button>
      </div>

      <!-- Rodapé do Card -->
      <div class="login-footer">
        <p>Novo por aqui? <a href="#" class="register-link">Crie uma conta gratuita</a></p>
      </div>
    </div>
  </main>

  <!-- Script para Interações Básicas (Toggle Password e Feedback de Carregamento) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const togglePasswordBtn = document.getElementById('toggle-password');
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');
      const form = document.getElementById('login-form');
      const btnSubmit = document.getElementById('btn-submit');

      // Alternar visualização da senha
      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        togglePasswordBtn.setAttribute('aria-label', isPassword ? 'Ocultar senha' : 'Mostrar senha');
        
        // Altera o ícone de olho aberto / olho fechado com SVG
        if (isPassword) {
          eyeIcon.innerHTML = `
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          `;
        } else {
          eyeIcon.innerHTML = `
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          `;
        }
      });

      // Validação básica e animação de envio
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const emailError = document.getElementById('email-error');
        const passwordError = document.getElementById('password-error');
        
        let isValid = true;

        // Validação simples de email
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailPattern.test(email.value)) {
          email.classList.add('input-invalid');
          emailError.style.display = 'block';
          isValid = false;
        } else {
          email.classList.remove('input-invalid');
          emailError.style.display = 'none';
        }

        // Validação simples de senha
        if (password.value.length < 6) {
          password.classList.add('input-invalid');
          passwordError.style.display = 'block';
          isValid = false;
        } else {
          password.classList.remove('input-invalid');
          passwordError.style.display = 'none';
        }

        if (isValid) {
          // Ativa estado de carregamento (Loading)
          btnSubmit.classList.add('btn-loading');
          btnSubmit.disabled = true;

          // Simula uma requisição AJAX / autenticação
          setTimeout(() => {
            alert('Autenticação simulada com sucesso! Redirecionando...');
            btnSubmit.classList.remove('btn-loading');
            btnSubmit.disabled = false;
            form.reset();
            // Reseta labels flutuantes
            document.querySelectorAll('.form-input').forEach(input => input.dispatchEvent(new Event('input')));
          }, 1800);
        }
      });

      // Limpar erro ao digitar
      document.querySelectorAll('.form-input').forEach(input => {
        input.addEventListener('input', () => {
          if (input.classList.contains('input-invalid')) {
            input.classList.remove('input-invalid');
            const errorId = `${input.id}-error`;
            const errorElement = document.getElementById(errorId);
            if (errorElement) {
              errorElement.style.display = 'none';
            }
          }
        });
      });
    });
  </script>
</body>
</html>
